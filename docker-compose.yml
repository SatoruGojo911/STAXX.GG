version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: staxx-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: staxx
      MONGO_INITDB_ROOT_PASSWORD: staxx_dev_password
      MONGO_INITDB_DATABASE: staxx
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staxx-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: staxx-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      MONGODB_URI: mongodb://staxx:staxx_dev_password@mongodb:27017/staxx?authSource=admin
      MONGODB_DATABASE: staxx
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: dev_secret_key_at_least_32_characters_long
      GOOGLE_CLIENT_ID: ""
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: staxx-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api

volumes:
  mongodb_data:
  redis_data:
